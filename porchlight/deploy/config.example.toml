# topic_prefix = "porchlight"
# discovery = true                # Home Assistant MQTT discovery

[debug]
capture_jsonl = ""                # e.g. "/var/lib/porchlight/capture.jsonl": raw ads for replay. Holds real identifiers!
capture_max_mb = 50               # per day
