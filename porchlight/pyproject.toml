[project]
name = "porchlight"
version = "0.1.0"
description = "A BLE home alarm for a Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "bleak>=3.0",
    "aiohttp>=3.9",
]

[project.scripts]
porchlight = "porchlight.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["porchlight", "porchlight.notify", "porchlight.web"]

[tool.setuptools.package-data]
porchlight = ["*.json", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
